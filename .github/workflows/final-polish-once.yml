name: Final UI polish 0.11.1

on:
  push:
    branches:
      - main
    paths:
      - 'final_polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI polish
        run: python final_polish.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test build and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Prepare signing input
        run: |
          mkdir -p build/delivery
          cp app/build/outputs/apk/debug/app-debug.apk build/delivery/app-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/delivery/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: zvonilka-0.11.1-signing-input
          path: build/delivery/
      - name: Commit implementation
        run: |
          git rm final_polish.py final-polish.patch .github/workflows/final-polish-once.yml .final-polish-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/zvonilka/prototype/MainActivity.kt app/build.gradle.kts
          git commit -m "Polish UI and simplify call history metadata"
          git push origin HEAD:main
