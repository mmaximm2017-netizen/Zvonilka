name: Keypad scale 0.11.4
on:
  push:
    branches: [ui/larger-lower-keypad-0.11.4-work]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/larger-lower-keypad-0.11.4-work
      - name: Apply keypad scaling
        run: python keypad_scale_0114.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test build and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/zvonilka/prototype/MainActivity.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Enlarge and lower keypad layout'
            git push origin HEAD:ui/larger-lower-keypad-0.11.4-work
          fi
