name: Android 16 call notification 0.12.4
on:
  push:
    branches: [ fix/android16-call-notification-0.12.4 ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply notification fix
        run: python apply_android16_notification_fix.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test release build and lint
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon
      - name: Commit fix
        run: |
          git config user.name "mmaximm2017-netizen"
          git config user.email "mmaximm2017@gmail.com"
          git add app/build.gradle.kts app/src/main/java/ru/zvonilka/prototype/PhoneService.kt
          git commit -m "Handle Android 16 call notifications safely"
          git push origin HEAD:fix/android16-call-notification-0.12.4
