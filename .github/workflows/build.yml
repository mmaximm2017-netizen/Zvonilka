name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }
      - name: Prepare local signing inputs (no private key in CI)
        run: |
          mkdir -p build/delivery
          cp app/build/outputs/apk/debug/app-debug.apk build/delivery/app-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/delivery/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: zvonilka-signing-input
          path: build/delivery/
