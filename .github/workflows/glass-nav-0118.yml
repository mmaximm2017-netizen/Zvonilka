name: Glass navigation 0.11.8
on:
  push:
    branches: [ui/glass-nav-0.11.8]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/glass-nav-0.11.8
      - name: Apply glass navigation
        run: python glass_nav_0118.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test release build and lint
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/zvonilka/prototype/MainActivity.kt app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "Add floating glass bottom navigation"
          git push origin HEAD:ui/glass-nav-0.11.8
