name: Emil polish 0.11.7
on:
  push:
    branches: [ui/emil-polish-0.11.7]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/emil-polish-0.11.7
      - name: Apply UI polish
        run: python emil_polish_0117.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test release build and lint
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/zvonilka/prototype/CallSlideAction.kt app/src/main/java/ru/zvonilka/prototype/Ui.kt app/src/main/java/ru/zvonilka/prototype/CallActivity.kt app/src/main/java/ru/zvonilka/prototype/GesturePolicy.kt app/src/test/java/ru/zvonilka/prototype/GesturePolicyTest.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Polish call gestures and in-call interactions'
            git push origin HEAD:ui/emil-polish-0.11.7
          fi
