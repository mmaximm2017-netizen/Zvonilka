name: Instant history 0.11.5
on:
  push:
    branches: [perf/instant-history-0.11.5]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/instant-history-0.11.5
      - name: Apply instant history change
        run: python instant_history_0115.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test build and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/zvonilka/prototype/MainActivity.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Show call history before contacts finish loading'
            git push origin HEAD:perf/instant-history-0.11.5
          fi
